

<div
    id="delete-experience-{{ experience.id }}"
    class="project-delete-modal"
    popover="auto"
    role="dialog"
    aria-labelledby="delete-experience-title-{{ experience.id }}"
    aria-describedby="delete-experience-description-{{ experience.id }}"
>
    <button
        type="button"
        class="project-delete-modal__backdrop"
        popovertarget="delete-experience-{{ experience.id }}"
        popovertargetaction="hide"
        aria-label="Tutup konfirmasi hapus"
    ></button>

    <div class="project-delete-modal__content">
        <button
            type="button"
            class="project-delete-modal__close"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"
        >
            ×
        </button>

        <h2 id="delete-experience-title-{{ experience.id }}">
            Hapus Experience?
        </h2>

        <p id="delete-experience-description-{{ experience.id }}">
            Apakah Anda yakin ingin menghapus pengalaman
            <strong>{{ experience.title }}</strong> di
            <strong>{{ experience.place }}</strong>?
            Data yang dihapus tidak dapat dikembalikan.
        </p>

        <div class="project-delete-modal__actions">
            <button
                type="button"
                class="button button-secondary"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
            >
                Batal
            </button>

            <form
                method="post"
                action="{% url 'main:delete_experience' experience.id %}"
            >
                {% csrf_token %}

                <button
                    type="submit"
                    class="button education-delete-confirm-button"
                >
                    Ya, Hapus Experience
                </button>
            </form>
        </div>
    </div>
</div>
