<div id="add-education-modal" class="project-form-modal" popover="auto" role="dialog"
     aria-labelledby="add-education-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-education-modal"
            popovertargetaction="hide" aria-label="Tutup form"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-education-modal"
                popovertargetaction="hide" aria-label="Tutup form">×</button>
        <h2 id="add-education-title">Tambah Education</h2>
        <form id="education-form" method="post" action="{% url 'main:create_education_ajax' %}" class="project-form">
            {% csrf_token %}
            <p class="form-error" data-error-field="__all__" role="alert" hidden></p>
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                <p id="education-error-{{ field.name }}" class="form-error" data-error-field="{{ field.name }}" hidden></p>
            </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-education-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Education</button>
            </div>
        </form>
    </div>
</div>
